<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Xtreme | Profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="brand logo-tilt">
    <img src="images/xtreme-logo.png" class="logo-img" alt="Xtreme Logo">
    <h1>Xtreme</h1>
  </div>

  <!-- Theme Toggle -->
  <label class="theme-switch">
    <input type="checkbox" id="theme-toggle">
    <span class="switch-track">
      <span class="switch-thumb"></span>
    </span>
  </label>

  <nav>
    <a href="index.html" class="nav-link">Home</a>
    <a href="merchandise.html" class="nav-link">Merchandise</a>
    <a href="cart.html" class="nav-link">Cart</a>
    <a href="orders.html" class="nav-link">Orders</a>
    <a href="profile.html" class="nav-link">Profile</a>
    <a href="about.html" class="nav-link">About</a>
    <a href="contact.html" class="nav-link">Contact</a>
    <a href="faq.html" class="nav-link">FAQ</a>
</nav>
</header>

<div class="page">
  <h2>User Profile</h2>

  <h3>Personal Details</h3>
  <p><b>Name:</b> Xtreme User</p>
  <p><b>Email:</b> xtreme@gmail.com</p>
  <p><b>Location:</b> Mumbai, India</p>

  <hr>

  <h3>Order History</h3>
  <div id="order-history"></div>

  <hr>

  <h3>Help & Support</h3>
  <p>
    Need help? Visit our
    <a href="faq.html" style="color:#ff2f92;font-weight:600;">FAQ page</a>.
  </p>
</div>

<script src="script.js"></script>
<script>
  const orders = JSON.parse(localStorage.getItem("orders")) || [];
  const orderDiv = document.getElementById("order-history");

  if (orders.length === 0) {
    orderDiv.innerHTML = "<p>No orders placed yet.</p>";
  } else {
    orders.forEach((order, index) => {
      orderDiv.innerHTML += `
        <p>
          <b>Order #${index + 1}</b><br>
          Items: ${order.items.length}<br>
          Total: ₹${order.total}
        </p>
        <hr>
      `;
    });
  }
</script>

</body>
</html>
