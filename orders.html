<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Xtreme | Orders</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="brand logo-tilt">
    <img src="images/xtreme-logo.png" class="logo-img" alt="Xtreme Logo">
    <h1>Xtreme</h1>
  </div>

  <!-- Theme Toggle -->
  <label class="theme-switch">
    <input type="checkbox" id="theme-toggle">
    <span class="switch-track">
      <span class="switch-thumb"></span>
    </span>
  </label>

  <nav>
    <a href="index.html" class="nav-link">Home</a>
    <a href="merchandise.html" class="nav-link">Merchandise</a>
    <a href="cart.html" class="nav-link">Cart</a>
    <a href="orders.html" class="nav-link">Orders</a>
    <a href="profile.html" class="nav-link">Profile</a>
    <a href="about.html" class="nav-link">About</a>
    <a href="contact.html" class="nav-link">Contact</a>
    <a href="faq.html" class="nav-link">FAQ</a>
</nav>
</header>

<div class="page">
  <h2>Your Orders</h2>
  <div id="orders-list"></div>
</div>

<script src="script.js"></script>
<script>
  const orders = JSON.parse(localStorage.getItem("orders")) || [];
  const list = document.getElementById("orders-list");

  if (orders.length === 0) {
    list.innerHTML = "<p>No previous purchases found.</p>";
  } else {
    orders.forEach((order, index) => {
      let items = order.items.map(
        item => `<li>${item.name} – ₹${item.price}</li>`
      ).join("");

      list.innerHTML += `
        <div style="margin-bottom:20px">
          <h3>Order #${index + 1}</h3>
          <ul>${items}</ul>
          <p><b>Total:</b> ₹${order.total}</p>
          <hr>
        </div>
      `;
    });
  }
</script>

</body>
</html>
